<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="grillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#flameGrad)" stroke-width="4" opacity="0.35"/>

  <!-- Plancha Grill Base -->
  <rect x="96" y="360" width="320" height="24" rx="12" fill="#334155"/>
  <rect x="116" y="384" width="40" height="20" rx="6" fill="#1e293b"/>
  <rect x="356" y="384" width="40" height="20" rx="6" fill="#1e293b"/>

  <!-- Glowing Flame -->
  <g filter="url(#glow)">
    <path d="M256 70 C240 130 190 190 190 260 C190 330 220 350 256 350 C292 350 322 330 322 260 C322 190 272 130 256 70 Z" fill="url(#flameGrad)"/>
    <path d="M256 160 C248 195 220 230 220 275 C220 315 236 335 256 335 C276 335 292 315 292 275 C292 230 264 195 256 160 Z" fill="#fbbf24"/>
    <path d="M256 230 C252 250 240 270 240 290 C240 315 248 325 256 325 C264 325 272 315 272 290 C272 270 260 250 256 230 Z" fill="#ffffff"/>
  </g>

  <!-- Plancha Sizzle Marks -->
  <line x1="140" y1="360" x2="372" y2="360" stroke="url(#grillGrad)" stroke-width="6" stroke-linecap="round"/>
</svg>